version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    ignore:
      # Major Charmbracelet bumps need a deliberate TUI review.
      - dependency-name: "github.com/charmbracelet/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    # Prefer patch/minor; majors are reviewed manually.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
