name: Bug report
description: Report a bug in aiswitch
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve aiswitch.
        **Never paste tokens, API keys, cookies, or private keys.**

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug.
      placeholder: When I run `aiswitch use trabalho`, ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps without secrets.
      placeholder: |
        1. aiswitch create demo
        2. aiswitch login claude demo
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: aiswitch version
      placeholder: output of `aiswitch version`
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Logs, screenshots of the TUI (no secrets), related PRs.
